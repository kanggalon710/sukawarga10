<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f7a4d"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  
  <!-- Abstract 4 people circle -->
  <g transform="translate(250, 210)">
    <!-- Top Left (Green) -->
    <path d="M-50,-50 C-20,-100 30,-70 50,-50 C20,-30 -20,-20 -50,-50 Z" fill="url(#grad1)" opacity="0.95"/>
    <path d="M-50,-50 C-100,-20 -70,30 -50,50 C-30,20 -20,-20 -50,-50 Z" fill="url(#grad1)" opacity="0.95"/>
    <circle cx="-65" cy="-65" r="22" fill="url(#grad1)"/>
    
    <!-- Top Right (Amber) -->
    <path d="M50,-50 C20,-100 -30,-70 -50,-50 C-20,-30 20,-20 50,-50 Z" fill="url(#grad2)" opacity="0.95"/>
    <path d="M50,-50 C100,-20 70,30 50,50 C30,20 20,-20 50,-50 Z" fill="url(#grad2)" opacity="0.95"/>
    <circle cx="65" cy="-65" r="22" fill="url(#grad2)"/>
    
    <!-- Bottom Right (Green) -->
    <path d="M50,50 C20,100 -30,70 -50,50 C-20,30 20,20 50,50 Z" fill="url(#grad1)" opacity="0.95"/>
    <path d="M50,50 C100,20 70,-30 50,-50 C30,-20 20,20 50,50 Z" fill="url(#grad1)" opacity="0.95"/>
    <circle cx="65" cy="65" r="22" fill="url(#grad1)"/>
    
    <!-- Bottom Left (Amber) -->
    <path d="M-50,50 C-20,100 30,70 50,50 C20,30 -20,20 -50,50 Z" fill="url(#grad2)" opacity="0.95"/>
    <path d="M-50,50 C-100,20 -70,-30 -50,-50 C-30,-20 -20,20 -50,50 Z" fill="url(#grad2)" opacity="0.95"/>
    <circle cx="-65" cy="65" r="22" fill="url(#grad2)"/>
  </g>

  <!-- Typography -->
  <text x="250" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0f7a4d" text-anchor="middle" letter-spacing="-0.5">Portal<tspan fill="#f59e0b"> Desa</tspan></text>
  
  <!-- Marking -->
  <text x="250" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1">by PT Arkanova Cipta Inovasi</text>
</svg>
